name: Engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Chinese fonts on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install locked dependencies
        run: npm ci
      - name: Select and probe the runner's stable Chrome on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          /usr/bin/google-chrome --headless --dump-dom about:blank
          echo "READING_TREE_PDF_BROWSER=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - name: Verify build, behavior and harness execution
        run: npm run check
      - name: Keep reports and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
